# 模型池配置：按 priority 升序降级（1 为最高优先级）
models:
  - name: "private/qwen2.5-14b"
    endpoint: "http://mock-upstream:9000/v1/chat/completions"
    api_key_env: "QWEN_API_KEY"   # 从环境变量读取上游 key
    priority: 1
  - name: "private/glm-4-9b"
    endpoint: "http://backup-upstream:9001/v1/chat/completions"
    api_key_env: "GLM_API_KEY"
    priority: 2
  - name: "mock/local"            # 无 key 演示用的 mock 模型
    endpoint: "mock://local"
    api_key_env: ""
    priority: 3
