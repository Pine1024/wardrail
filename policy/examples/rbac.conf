# WardRail 策略即代码 (M8) — Casbin RBAC with domains
# 语义: 在 <域(租户/部门)> 中, <主体> 对 <对象> 拥有 <动作> 权限

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && (r.dom == p.dom || p.dom == "*") && (r.obj == p.obj || p.obj == "*") && regexMatch(r.act, p.act)

# ---- 示例策略 ----
# analyst 角色可在 finance 域使用 analyst agent (仅允许 low/medium 风险工具)
p, role:analyst, finance, agent:analyst, run:(low|medium)
# risk-officer 可审批 finance 域所有高危动作
p, role:risk-officer, finance, approval:*, approve
# 默认禁止任何人调用 critical 工具, 除非显式授权
p, role:admin, *, agent:*, run:(low|medium|high|critical)
